<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: layout('Gestión de Usuarios', ~{::main})}">
    <title>Usuarios</title>
</head>
<body>
<main>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <nav aria-label="breadcrumb" class="mb-1">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="/admin/dashboard">Panel Admin</a></li>
                    <li class="breadcrumb-item active">Usuarios</li>
                </ol>
            </nav>
            <h2><i class="bi bi-people me-2"></i>Gestión de Usuarios</h2>
        </div>
    </div>

    <!-- Alertas -->
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Usuario</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Registro</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td class="text-muted small" th:text="${u.id}"></td>
                        <td>
                            <div class="fw-bold" th:text="${u.nombre}">Nombre</div>
                            <small class="text-muted" th:text="${u.username}">@username</small>
                        </td>
                        <td th:text="${u.email}">email@ejemplo.com</td>
                        <td>
                            <span th:switch="${u.rol.name()}">
                                <span th:case="'ADMINISTRADOR'" class="badge bg-danger">Admin</span>
                                <span th:case="'ORGANIZADOR'"   class="badge bg-primary">Organizador</span>
                                <span th:case="'PARTICIPANTE'"  class="badge bg-secondary">Participante</span>
                            </span>
                        </td>
                        <td>
                            <span th:if="${u.activo}"  class="badge bg-success">Activo</span>
                            <span th:unless="${u.activo}" class="badge bg-danger">Bloqueado</span>
                        </td>
                        <td>
                            <small class="text-muted"
                                   th:text="${#temporals.format(u.fechaRegistro, 'dd/MM/yyyy')}">-</small>
                        </td>
                        <td class="text-end">
                            <!-- No se pueden realizar acciones sobre el admin -->
                            <div th:if="${!u.esAdmin()}" class="d-flex justify-content-end gap-1">

                                <!-- Bloquear / Desbloquear -->
                                <form th:if="${u.activo}"
                                      th:action="@{'/admin/usuarios/' + ${u.id} + '/bloquear'}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('¿Bloquear a este usuario?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Bloquear">
                                        <i class="bi bi-lock"></i>
                                    </button>
                                </form>
                                <form th:unless="${u.activo}"
                                      th:action="@{'/admin/usuarios/' + ${u.id} + '/desbloquear'}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-success" title="Desbloquear">
                                        <i class="bi bi-unlock"></i>
                                    </button>
                                </form>

                                <!-- Cambiar Rol -->
                                <button class="btn btn-sm btn-outline-primary"
                                        title="Cambiar Rol"
                                        data-bs-toggle="modal"
                                        data-bs-target="#modalRol"
                                        th:data-usuario-id="${u.id}"
                                        th:data-usuario-nombre="${u.nombre}"
                                        th:data-rol-actual="${u.rol.name()}">
                                    <i class="bi bi-person-gear"></i>
                                </button>
                            </div>
                            <span th:if="${u.esAdmin()}" class="text-muted small">—</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="7" class="text-center py-4 text-muted">No hay usuarios registrados</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal cambio de rol -->
    <div class="modal fade" id="modalRol" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-person-gear me-2"></i>Cambiar Rol</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formRol" method="post">
                    <div class="modal-body">
                        <p class="text-muted mb-3">Usuario: <strong id="modal-nombre-usuario"></strong></p>
                        <label class="form-label fw-bold">Nuevo Rol</label>
                        <select name="rol" class="form-select" id="modal-select-rol">
                            <option value="PARTICIPANTE">Participante</option>
                            <option value="ORGANIZADOR">Organizador</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('modalRol').addEventListener('show.bs.modal', function (e) {
            const btn = e.relatedTarget;
            const id     = btn.getAttribute('data-usuario-id');
            const nombre = btn.getAttribute('data-usuario-nombre');
            const rol    = btn.getAttribute('data-rol-actual');

            document.getElementById('modal-nombre-usuario').textContent = nombre;
            document.getElementById('formRol').action = '/admin/usuarios/' + id + '/rol';
            document.getElementById('modal-select-rol').value = rol;
        });
    </script>

</main>
</body>
</html>
