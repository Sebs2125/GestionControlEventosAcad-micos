events {
    worker_connections 1024;
}

http {

    # ── Redirección HTTP → HTTPS (punto 12)
    server {
        listen 80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS con certificado SSL/TLS (punto 12)
    server {
        listen 443 ssl;
        server_name _;

        # Certificado SSL
        # Opción A: Certbot / Let's Encrypt (recomendado para producción)
        #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
        #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
        #
        # Opción B: Certificado autofirmado para pruebas
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Protocolos y cifrados seguros
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       10m;

        # Cabeceras de seguridad
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;

        # Tamaño máximo de petición (para subida de archivos si aplica)
        client_max_body_size 10M;

        # ── Proxy inverso hacia la aplicación Javalin
        location / {
            proxy_pass         http://app:7000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Soporte para sesiones (cookies)
            proxy_set_header Connection        "";
            proxy_buffering                    off;
        }
    }
}