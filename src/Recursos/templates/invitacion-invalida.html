<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: layout('Invitación no encontrada', ~{::main})}">
    <title>Inválido</title>
</head>
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4 text-center py-5">
            <i class="bi bi-qr-code display-1 text-muted mb-4 d-block"></i>
            <h3 class="text-danger">Invitación no encontrada</h3>
            <p class="text-muted">
                El código QR escaneado no corresponde a ninguna inscripción válida
                en el sistema.
            </p>
            <a href="/eventos" class="btn btn-primary mt-2">
                <i class="bi bi-calendar-event me-2"></i>Ver eventos disponibles
            </a>
        </div>
    </div>
</main>
</body>
</html>
