<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, contenido)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Eventos Académicos'">Eventos Académicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/estilos.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-calendar-event me-2"></i>Eventos Académicos
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/eventos"><i class="bi bi-list me-1"></i>Lista</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/eventos/grid"><i class="bi bi-grid me-1"></i>Tarjetas</a>
                </li>
            </ul>

            <ul class="navbar-nav">
                <!-- No logueado -->
                <li th:if="${session.usuario == null}" class="nav-item">
                    <a class="nav-link" href="/login"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a>
                </li>
                <li th:if="${session.usuario == null}" class="nav-item">
                    <a class="nav-link" href="/registro"><i class="bi bi-person-plus me-1"></i>Registro</a>
                </li>

                <!-- Logueado -->
                <li th:if="${session.usuario != null}" class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${session.usuario.nombre}">Usuario</span>
                        <span class="badge bg-secondary ms-1" th:text="${session.rol}">ROL</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">

                        <!-- Participante -->
                        <li th:if="${session.rol == 'PARTICIPANTE'}">
                            <a class="dropdown-item" href="/participante/mis-inscripciones">
                                <i class="bi bi-ticket-perforated me-2"></i>Mis Inscripciones
                            </a>
                        </li>
                        <li th:if="${session.rol == 'PARTICIPANTE'}">
                            <a class="dropdown-item" href="/participante/perfil">
                                <i class="bi bi-person-gear me-2"></i>Mi Perfil
                            </a>
                        </li>

                        <!-- Organizador / Admin -->
                        <li th:if="${session.rol == 'ORGANIZADOR' or session.rol == 'ADMINISTRADOR'}">
                            <a class="dropdown-item" href="/organizador/dashboard">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                        </li>
                        <li th:if="${session.rol == 'ADMINISTRADOR'}">
                            <a class="dropdown-item" href="/admin/dashboard">
                                <i class="bi bi-shield-lock me-2"></i>Administrar
                            </a>
                        </li>

                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item text-danger" href="/logout">
                                <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4" th:insert="${contenido}"></div>

<

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
