<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Iniciar Sesión', ~{::main})}">
<head><title>Iniciar Sesión</title></head>
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-calendar-event display-4 text-primary"></i>
                        <h3 class="mt-3">Bienvenido</h3>
                        <p class="text-muted">Ingresa tus credenciales</p>
                    </div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
                    <form action="/login" method="post">
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                        </button>
                    </form>
                    <hr class="my-4">
                    <p class="text-center mb-0">
                        ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
