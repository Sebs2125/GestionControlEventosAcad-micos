<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: layout('Eventos - Vista Tarjetas', ~{::main})}">
    <title>Eventos</title>
</head>
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-grid me-2"></i>Eventos Disponibles</h2>
        <div class="btn-group">
            <a href="/eventos" class="btn btn-outline-primary"><i class="bi bi-list"></i> Lista</a>
            <a href="/eventos/grid" class="btn btn-primary active"><i class="bi bi-grid"></i> Tarjetas</a>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="evento : ${eventos}">
            <div class="card h-100 shadow-sm hover-card">
                <div class="card-header bg-primary text-white">
                    <small><i class="bi bi-calendar me-1"></i>
                        <span th:text="${#temporals.format(evento.fechaHora, 'EEEE, dd MMMM yyyy')}">Fecha</span></small>
                </div>
                <div class="card-body">
                    <h5 class="card-title text-truncate" th:text="${evento.titulo}">Título</h5>
                    <p class="card-text text-muted" th:text="${#strings.abbreviate(evento.descripcion, 100)}">Desc</p>

                    <ul class="list-unstyled small text-muted mb-3">
                        <li><i class="bi bi-clock me-2"></i>
                            <span th:text="${#temporals.format(evento.fechaHora, 'HH:mm')}">Hora</span></li>
                        <li><i class="bi bi-geo-alt me-2"></i><span th:text="${evento.lugar}">Lugar</span></li>
                        <li><i class="bi bi-people me-2"></i>
                            <span th:text="${evento.cuposDisponibles}">0</span> cupos disponibles</li>
                    </ul>
                </div>
                <div class="card-footer bg-white border-top-0">
                    <a th:href="@{'/eventos/' + ${evento.id}}" class="btn btn-outline-primary w-100">
                        Ver Detalles <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Sin eventos -->
        <div th:if="${#lists.isEmpty(eventos)}" class="col-12 text-center py-5">
            <i class="bi bi-calendar-x display-1 text-muted"></i>
            <h4 class="mt-3 text-muted">No hay eventos disponibles</h4>
        </div>
    </div>
</main>

<style>
    .hover-card {
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .hover-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
    }
</style>
</body>
</html>
