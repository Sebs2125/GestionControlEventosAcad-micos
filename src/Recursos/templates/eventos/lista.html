<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Eventos - Vista Lista', ~{::main})}">
<head><title>Eventos</title></head>
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-list me-2"></i>Eventos Disponibles</h2>
        <div class="btn-group">
            <a href="/eventos" class="btn btn-primary active"><i class="bi bi-list"></i> Lista</a>
            <a href="/eventos/grid" class="btn btn-outline-primary"><i class="bi bi-grid"></i> Tarjetas</a>
        </div>
    </div>

    <div class="d-flex flex-column gap-3">
        <div th:each="evento : ${eventos}" class="card shadow-sm border-0 overflow-hidden">
            <div class="row g-0">
                <!-- Imagen izquierda -->
                <div class="col-md-3 col-lg-2">
                    <img th:if="${evento.imagenUrl != null}"
                         th:src="${evento.imagenUrl}"
                         th:alt="${evento.titulo}"
                         class="img-fluid h-100 w-100"
                         style="object-fit:cover; min-height:140px; max-height:180px;">
                    <div th:unless="${evento.imagenUrl != null}"
                         class="d-flex align-items-center justify-content-center h-100 bg-primary bg-opacity-10"
                         style="min-height:140px;">
                        <i class="bi bi-calendar-event display-4 text-primary opacity-50"></i>
                    </div>
                </div>
                <!-- Contenido -->
                <div class="col-md-9 col-lg-10">
                    <div class="card-body d-flex justify-content-between align-items-start p-3">
                        <div class="flex-grow-1">
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <h5 class="mb-0 fw-bold" th:text="${evento.titulo}">Título</h5>
                                <span class="badge bg-success" th:if="${evento.tieneCuposDisponibles()}">Disponible</span>
                                <span class="badge bg-danger" th:unless="${evento.tieneCuposDisponibles()}">Agotado</span>
                            </div>
                            <p class="text-muted mb-2 small"
                               th:text="${#strings.abbreviate(evento.descripcion, 120)}">Desc</p>
                            <div class="d-flex flex-wrap gap-3 text-muted small">
                                <span><i class="bi bi-calendar me-1 text-primary"></i>
                                    <span th:text="${#temporals.format(evento.fechaHora, 'dd/MM/yyyy HH:mm')}">Fecha</span></span>
                                <span><i class="bi bi-geo-alt me-1 text-danger"></i>
                                    <span th:text="${evento.lugar}">Lugar</span></span>
                                <span><i class="bi bi-people me-1 text-info"></i>
                                    <span th:text="${evento.cuposDisponibles}">0</span> de
                                    <span th:text="${evento.cupoMaximo}">0</span> cupos</span>
                            </div>
                        </div>
                        <a th:href="@{'/eventos/' + ${evento.id}}"
                           class="btn btn-outline-primary ms-3 text-nowrap align-self-center">
                            Ver Detalles <i class="bi bi-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(eventos)}" class="text-center py-5 text-muted">
            <i class="bi bi-calendar-x display-1 d-block mb-3"></i>
            <h4>No hay eventos disponibles</h4>
        </div>
    </div>
</main>
</body>
</html>
