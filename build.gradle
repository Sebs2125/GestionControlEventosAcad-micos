plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'edu.pucmm'
version = '1.0-SNAPSHOT'

// Control de versión de Java
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/JavaClass']
        }
        resources {
            srcDirs = ['src/Recursos']
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Javalin Framework Web
    implementation 'io.javalin:javalin:5.6.3'
    implementation 'io.javalin:javalin-rendering:5.6.3'

    // Thymeleaf para templates
    implementation 'org.thymeleaf:thymeleaf:3.1.2.RELEASE'

    // Hibernate ORM
    implementation 'org.hibernate:hibernate-core:5.6.15.Final'
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'

    // H2 Database
    implementation 'com.h2database:h2:2.2.224'

    // Connection Pool (mejor performance)
    implementation 'com.zaxxer:HikariCP:5.0.1'

    // Seguridad - BCrypt
    implementation 'org.mindrot:jbcrypt:0.4'

    // Logging
    implementation 'org.slf4j:slf4j-simple:2.0.9'

    // Jackson para JSON (API REST)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'

    // QR Code generation
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.google.zxing:javase:3.5.2'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'io.javalin:javalin-testtools:5.6.3'
}

application {
    mainClass = 'Eventos.Main'
}

shadowJar {
    archiveClassifier.set('')
    manifest {
        attributes 'Main-Class': 'Eventos.Main'
    }
    mergeServiceFiles()
}

test {
    useJUnitPlatform()
}

// Tarea personalizada para ejecutar con hot-reload en desarrollo
task runDev(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'edu.pucmm.eventos.Main'
    systemProperty 'dev.mode', 'true'
}
