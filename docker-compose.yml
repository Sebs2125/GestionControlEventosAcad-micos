services:

  # ── Servidor H2 en modo servidor (punto 10a-3)
  h2-server:
    image: oscarfonts/h2:latest
    container_name: h2-server
    restart: unless-stopped
    volumes:
      - h2-data:/opt/h2-data
    networks:
      - app-network

  # ── Aplicación Javalin
  app:
    image: tu-usuario-dockerhub/eventos-academicos:latest   # <── cambiar por tu usuario
    container_name: eventos-app
    restart: unless-stopped
    depends_on:
      - h2-server
    environment:
      PORT: 7000
      DB_URL: jdbc:h2:tcp://h2-server/~/eventos_academicos
      DB_USER: sa
      DB_PASS: ""
    networks:
      - app-network
    expose:
      - "7000"

  # ── Nginx — proxy inverso + SSL/TLS (punto 12)
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"    # Redirección HTTP → HTTPS
      - "443:443"  # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # Certificados SSL
    networks:
      - app-network

volumes:
  h2-data:

networks:
  app-network:
    driver: bridge